<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yongrilan - Portal de acceso</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 360px;
      background: white;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      color: #123c73;
    }

    .logo p {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #123c73;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0d2d57;
    }

    .warning {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }

    #resultado {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #123c73;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>Yongrilan</h1>
      <p>Portal de acceso empresarial</p>
    </div>

    <form id="loginForm">

      <label for="usuario">Correo electrónico</label>
      <input
        type="email"
        id="usuario"
        placeholder="usuario@ejemplo.com"
        required
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        required
      >

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

    <div id="resultado"></div>

    <div class="warning">
      Datos.
    </div>

  </div>


  <script>
    const formulario = document.getElementById("loginForm");
    const resultado = document.getElementById("resultado");

    formulario.addEventListener("submit", function(event) {

      event.preventDefault();

      // No se leen, guardan ni transmiten las credenciales.
      resultado.textContent =
        "Información correcta";

      formulario.reset();
    });
  </script>

</body>
</html>
